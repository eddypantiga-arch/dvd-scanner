<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVDthèque Cloud</title>
  
  <!-- Firebase SDK Compat v9 -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #e50914;
      --text: #ffffff;
      --text-sub: #aaaaaa;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      padding-bottom: 80px;
    }

    header {
      background-color: #000000;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid #333333;
      color: var(--accent);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .container {
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    #status-banner {
      background: #f39c12;
      color: #000000;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      font-weight: bold;
      transition: background 0.3s;
    }

    .add-box {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333333;
      margin-bottom: 20px;
    }

    input, select, button.action-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }

    input, select {
      background: #2a2a2a;
      color: #ffffff;
      border: 1px solid #444444;
    }

    button.action-btn {
      background: var(--accent);
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #333333;
      position: relative;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #2a2a2a;
    }

    .card-info {
      padding: 10px;
      flex-grow: 1;
    }

    .card-title {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .badge-format {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      color: #ffffff;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
    }

    .btn-delete {
      background: #c0392b;
      color: #ffffff;
      border: none;
      padding: 8px;
      margin: 5px 10px 10px 10px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #000000;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #333333;
      padding: 10px 0;
      z-index: 99;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    nav button.active {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header>🎬 DVDthèque Cloud</header>

  <div class="container">
    <div id="status-banner">Connexion à Firebase...</div>

    <!-- TAB COLLECTION -->
    <div id="tab-collection" class="tab-content active">
      
      <!-- Ajout manuel direct dans la base -->
      <div class="add-box">
        <h3 style="margin-bottom: 5px;">➕ Ajouter un titre en direct</h3>
        <input type="text" id="manual-title" placeholder="Ex: Matrix, Inception...">
        <select id="manual-format">
          <option value="4K UHD" selected>💜 4K Ultra HD</option>
          <option value="Blu-ray">🟦 Blu-ray</option>
          <option value="DVD">📀 DVD</option>
        </select>
        <button class="action-btn" onclick="addManualMovie()">Ajouter à la base</button>
      </div>

      <!-- Filtre local de recherche -->
      <input type="text" id="filter-input" placeholder="🔎 Filtrer la liste affichée..." onkeyup="renderCollection()">

      <h3 id="collection-count" style="margin: 20px 0 10px 0;">Ma Collection (0)</h3>
      <div id="collection-grid" class="grid"></div>
    </div>

    <!-- TAB RECHERCHE TMDB -->
    <div id="tab-search" class="tab-content">
      <div style="display:flex; gap:5px;">
        <input type="text" id="search-input" placeholder="Rechercher sur TMDB..." onkeyup="if(event.key==='Enter') searchTMDB()">
        <button onclick="searchTMDB()" style="background:var(--accent); color:white; border:none; border-radius:6px; padding:10px 15px; font-weight:bold; cursor:pointer;">🔍</button>
      </div>
      <div id="search-results" class="grid" style="margin-top:15px;"></div>
    </div>

    <!-- TAB CONFIGURATION -->
    <div id="tab-api" class="tab-content">
      <h3>Configuration Clé API TMDB</h3>
      <p style="font-size:0.85rem; color:var(--text-sub); margin-top:5px;">Enregistre ta clé pour activer la recherche avec affiches.</p>
      <input type="text" id="api-key-input" placeholder="Colle ta clé API TMDB ici">
      <button class="action-btn" onclick="saveApiKey()">Enregistrer dans le Cloud</button>
    </div>
  </div>

  <!-- BARRE DE NAVIGATION -->
  <nav>
    <button onclick="switchTab('collection')" id="nav-collection" class="active">📚 <span>Collection</span></button>
    <button onclick="switchTab('search')" id="nav-search">🔍 <span>Recherche</span></button>
    <button onclick="switchTab('api')" id="nav-api">⚙️ <span>Clé API</span></button>
  </nav>

  <script>
    // Configuration de ton projet Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyABV3JlLUv2gBksRgwSdOBo9MKWPE1s2ZU",
      authDomain: "dvdtheque-6a431.firebaseapp.com",
      projectId: "dvdtheque-6a431",
      storageBucket: "dvdtheque-6a431.firebasestorage.app",
      messagingSenderId: "1024820482868",
      appId: "1:1024820482868:web:8be06d09827f7a5bfecb61"
    };

    // Initialisation
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let localCollection = [];
    let tmdbApiKey = "";

    // Écoute dynamique de la collection 'movies'
    db.collection("movies").onSnapshot((snapshot) => {
      let banner = document.getElementById('status-banner');
      banner.style.background = '#27ae60';
      banner.style.color = '#ffffff';
      banner.innerText = `✅ Connecté : ${snapshot.docs.length} élément(s) détecté(s)`;

      localCollection = [];
      snapshot.forEach((doc) => {
        const data = doc.data();
        
        // Sécurisation de la lecture des propriétés
        let title = data.title || data.titre || data.nom || "Sans titre";
        let format = data.format || "DVD";
        let poster = data.poster || data.poster_path || data.image || "";

        if (poster && !poster.startsWith('http')) {
          poster = 'https://image.tmdb.org/t/p/w500' + poster;
        }

        localCollection.push({
          docId: doc.id,
          title: title,
          format: format,
          poster: poster
        });
      });

      renderCollection();
    }, (error) => {
      let banner = document.getElementById('status-banner');
      banner.style.background = '#c0392b';
      banner.style.color = '#ffffff';
      banner.innerText = "❌ Erreur de connexion : " + error.message;
    });

    // Chargement dynamique de la clé TMDB
    db.collection("settings").doc("tmdb").onSnapshot((doc) => {
      if (doc.exists && doc.data().key) {
        tmdbApiKey = doc.data().key;
        document.getElementById('api-key-input').value = tmdbApiKey;
      }
    });

    // Changement d'onglet
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      document.getElementById('nav-' + tabName).classList.add('active');
    }

    // Affichage des éléments filtrés ou complets
    function renderCollection() {
      let filterText = document.getElementById('filter-input').value.toLowerCase().trim();
      let filtered = localCollection.filter(m => m.title.toLowerCase().includes(filterText));

      document.getElementById('collection-count').innerText = `Ma Collection (${filtered.length})`;
      let grid = document.getElementById('collection-grid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:#aaa; padding:20px 0;">Aucun film trouvé.</p>';
        return;
      }

      filtered.forEach((movie) => {
        let posterUrl = movie.poster || 'https://via.placeholder.com/150x220?text=Pas+d+image';
        
        let card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="badge-format">${movie.format}</span>
          <img src="${posterUrl}" alt="${movie.title}">
          <div class="card-info">
            <div class="card-title">${movie.title}</div>
          </div>
          <button class="btn-delete" onclick="deleteMovie('${movie.docId}')">Supprimer</button>
        `;
        grid.appendChild(card);
      });
    }

    // Ajout direct dans Firestore
    async function addManualMovie() {
      let title = document.getElementById('manual-title').value.trim();
      let format = document.getElementById('manual-format').value;

      if (!title) return alert("Écris au moins un titre !");

      try {
        await db.collection("movies").add({
          title: title,
          format: format,
          createdAt: new Date()
        });
        document.getElementById('manual-title').value = '';
      } catch(err) {
        alert("Erreur lors de l'ajout : " + err.message);
      }
    }

    // Suppression d'un document
    async function deleteMovie(docId) {
      if (confirm("Supprimer ce titre définitivement ?")) {
        try {
          await db.collection("movies").doc(docId).delete();
        } catch(err) {
          alert("Erreur de suppression : " + err.message);
        }
      }
    }

    // Recherche via API TMDB
    async function searchTMDB() {
      let query = document.getElementById('search-input').value.trim();
      if (!tmdbApiKey) return alert("Renseigne d'abord ta clé API TMDB dans l'onglet Clé API !");
      if (!query) return;

      try {
        let res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${tmdbApiKey}&query=${encodeURIComponent(query)}&language=fr-FR`);
        let data = await res.json();
        let container = document.getElementById('search-results');
        container.innerHTML = '';

        if (data.results && data.results.length > 0) {
          data.results.slice(0, 6).forEach((m) => {
            let title = m.title || m.name || 'Sans titre';
            let poster = m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : '';
            
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <img src="${poster || 'https://via.placeholder.com/150x220?text=Pas+d+image'}" alt="${title}">
              <div class="card-info"><div class="card-title">${title}</div></div>
              <button class="action-btn" style="margin:5px 10px 10px 10px;" onclick="addTMDBMovie('${title.replace(/'/g, "\\'")}', '${poster}')">+ Collection</button>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:#aaa;">Aucun résultat TMDB.</p>';
        }
      } catch(e) {
        alert("Erreur de recherche TMDB : " + e.message);
      }
    }

    // Ajout depuis la recherche TMDB
    async function addTMDBMovie(title, poster) {
      let format = document.getElementById('manual-format').value;
      try {
        await db.collection("movies").add({
          title: title,
          poster: poster,
          format: format,
          createdAt: new Date()
        });
        alert(`✅ "${title}" a été ajouté !`);
      } catch(err) {
        alert("Erreur : " + err.message);
      }
    }

    // Sauvegarde de la clé API
    async function saveApiKey() {
      let key = document.getElementById('api-key-input').value.trim();
      if (key) {
        await db.collection("settings").doc("tmdb").set({ key: key });
        alert('Clé API enregistrée avec succès !');
      }
    }
  </script>
</body>
</html>
