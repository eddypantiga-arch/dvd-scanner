<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma DVDthèque & Séries</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #e50914;
      --text-color: #ffffff;
      --text-secondary: #aaaaaa;
      --border-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #000;
      padding: 15px;
      text-align: center;
      border-bottom: 2px solid var(--accent-color);
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      justify-content: space-around;
      background-color: #1a1a1a;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 12px 5px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      flex-grow: 1;
      text-transform: uppercase;
    }

    nav button.active {
      color: var(--accent-color);
      border-bottom: 3px solid var(--accent-color);
    }

    .container {
      padding: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .search-bar, .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input[type="text"], select, input[type="file"] {
      background-color: var(--card-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 4px;
      flex-grow: 1;
      font-size: 0.9rem;
    }

    button.action-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
      border: 1px solid #222;
    }

    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
    }

    .card-info {
      padding: 8px;
      font-size: 0.8rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    .badge {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: bold;
      border: 1px solid #555;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      color: #fff;
      cursor: pointer;
    }

    .format-selector {
      display: flex;
      gap: 10px;
      margin: 10px 0;
    }

    .format-selector label {
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <header>
    <h1>Ma DVDthèque</h1>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('collection')">Collection</button>
    <button class="nav-btn" onclick="switchTab('search')">Recherche</button>
    <button class="nav-btn" onclick="switchTab('airing')">Séries</button>
    <button class="nav-btn" onclick="switchTab('wishlist')">Envies</button>
    <button class="nav-btn" onclick="switchTab('api')">Config</button>
  </nav>

  <div class="container">

    <!-- ONGLET 1 : COLLECTION -->
    <div id="tab-collection" class="tab-content active">
      <div class="filter-bar">
        <input type="text" id="search-collection" placeholder="Filtrer par titre, acteur, réalisateur..." oninput="renderCollection()">
        <select id="filter-genre" onchange="renderCollection()">
          <option value="">Tous les genres</option>
        </select>
        <select id="sort-order" onchange="renderCollection()">
          <option value="az">Titre (A-Z)</option>
          <option value="za">Titre (Z-A)</option>
        </select>
      </div>
      <div id="collection-grid" class="grid"></div>
    </div>

    <!-- ONGLET 2 : RECHERCHE TMDB -->
    <div id="tab-search" class="tab-content">
      <div class="search-bar">
        <input type="text" id="tmdb-query" placeholder="Chercher un film ou une série...">
        <select id="tmdb-type">
          <option value="movie">Film</option>
          <option value="tv">Série</option>
        </select>
        <button class="action-btn" onclick="searchMovie()">Chercher</button>
      </div>

      <div class="format-selector">
        <span>Format d'ajout :</span>
        <label><input type="radio" name="format-choice" value="DVD" checked> DVD</label>
        <label><input type="radio" name="format-choice" value="Blu-ray"> Blu-ray</label>
        <label><input type="radio" name="format-choice" value="4K"> 4K</label>
      </div>

      <div id="search-grid" class="grid"></div>
    </div>

    <!-- ONGLET 3 : SÉRIES & DIFFUSIONS -->
    <div id="tab-airing" class="tab-content">
      <h3>Séries en cours de diffusion</h3>
      <div id="airing-grid" class="grid"></div>
    </div>

    <!-- ONGLET 4 : LISTE D'ENVIES -->
    <div id="tab-wishlist" class="tab-content">
      <h3>Ma Liste d'Envies</h3>
      <div id="wishlist-grid" class="grid"></div>
    </div>

    <!-- ONGLET 5 : CONFIGURATION & SAUVEGARDE -->
    <div id="tab-api" class="tab-content">
      <h3>Clé API TMDB</h3>
      <div class="search-bar">
        <input type="text" id="api-key-input" placeholder="Entrez votre clé API TMDB v3">
        <button class="action-btn" onclick="saveApiKey()">Enregistrer</button>
      </div>

      <hr style="margin: 25px 0; border: 0; border-top: 1px solid #333;">

      <h3>💾 Sauvegarde & Restauration</h3>
      <p style="font-size: 0.85rem; color: #aaa;">Exportez votre collection au format JSON ou réimportez une sauvegarde.</p>

      <button class="action-btn" onclick="exportCollection()" style="background: #27ae60; margin-bottom: 10px;">
        📥 Télécharger une sauvegarde (Export JSON)
      </button>

      <label style="font-size: 0.75rem; color: #aaa; display: block; margin-top: 10px;">Restaurer un fichier JSON :</label>
      <input type="file" id="import-file" accept=".json" onchange="importCollection(event)">
    </div>

  </div>

  <!-- MODAL FICHE DÉTAIL -->
  <div id="detail-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // Config Firebase (remplacez avec vos accès réels si nécessaire)
    const firebaseConfig = {
      apiKey: "VOTRE_API_KEY",
      authDomain: "VOTRE_PROJECT.firebaseapp.com",
      projectId: "VOTRE_PROJECT_ID",
      storageBucket: "VOTRE_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let localCollection = [];
    let localFavorites = [];
    let tmdbApiKey = "";

    // Synchronisation Firestore
    db.collection("movies").onSnapshot(snapshot => {
      localCollection = [];
      snapshot.forEach(doc => {
        localCollection.push({ docId: doc.id, ...doc.data() });
      });
      populateGenreDropdown();
      renderCollection();
    });

    db.collection("config").doc("tmdb").onSnapshot(doc => {
      if (doc.exists && doc.data().key) {
        tmdbApiKey = doc.data().key;
        document.getElementById('api-key-input').value = tmdbApiKey;
      }
    });

    db.collection("favorites").onSnapshot(snapshot => {
      localFavorites = [];
      snapshot.forEach(doc => localFavorites.push(doc.data().id));
    });

    // Navigation
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'airing') loadAiringTodayTV();
      if (tabName === 'wishlist') renderWishlist();
    }

    function formatDateFR(dateStr) {
      if (!dateStr) return "N/C";
      const p = dateStr.split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : dateStr;
    }

    function getSelectedFormat() {
      const radios = document.getElementsByName('format-choice');
      for (let r of radios) { if (r.checked) return r.value; }
      return 'DVD';
    }

    // Sauvegarde Clé API
    async function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (!key) return alert("Veuillez saisir une clé.");
      await db.collection("config").doc("tmdb").set({ key: key });
      alert("Clé API enregistrée !");
    }

    // TMDB Search & Details
    async function fetchMovieDetails(id, type = 'movie') {
      if (!tmdbApiKey) return {};
      try {
        const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${tmdbApiKey}&append_to_response=credits,watch/providers&language=fr-FR`);
        return await res.json();
      } catch (e) {
        return {};
      }
    }

    function formatTmdbItem(m, searchType) {
      const directors = m.credits?.crew ? m.credits.crew.filter(c => c.job === 'Director').map(c => c.name) : [];
      const cast = m.credits?.cast ? m.credits.cast.slice(0, 5).map(c => c.name) : [];
      const providers = m['watch/providers']?.results?.FR?.flatrate ? m['watch/providers'].results.FR.flatrate.map(p => p.provider_name) : [];

      return {
        id: m.id,
        title: m.title || m.name,
        type: searchType,
        year: (m.release_date || m.first_air_date || '').slice(0, 4),
        releaseDate: m.release_date || m.first_air_date || '',
        poster: m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : '',
        overview: m.overview || 'Aucun synopsis disponible.',
        genres: m.genres ? m.genres.map(g => g.name) : [],
        directors: directors,
        cast: cast,
        providers: providers
      };
    }

    async function searchMovie() {
      const query = document.getElementById('tmdb-query').value.trim();
      const type = document.getElementById('tmdb-type').value;
      if (!query || !tmdbApiKey) return alert("Vérifiez la recherche et la clé API.");

      const res = await fetch(`https://api.themoviedb.org/3/search/${type}?api_key=${tmdbApiKey}&query=${encodeURIComponent(query)}&language=fr-FR`);
      const data = await res.json();
      
      const grid = document.getElementById('search-grid');
      grid.innerHTML = '';

      for (let item of data.results) {
        const full = await fetchMovieDetails(item.id, type);
        const formatted = formatTmdbItem(full, type);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${formatted.poster || 'https://via.placeholder.com/150x225?text=No+Cover'}" alt="${formatted.title}">
          <div class="card-info">
            <div class="card-title">${formatted.title}</div>
            <div class="card-meta">${formatted.year}</div>
            <button class="action-btn" style="margin-top:5px; font-size:0.7rem;" onclick="triggerAddMovie('${formatted.id}', '${type}')">+ Ajouter</button>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    async function triggerAddMovie(id, type) {
      const full = await fetchMovieDetails(id, type);
      const formatted = formatTmdbItem(full, type);
      formatted.format = getSelectedFormat();
      formatted.addedAt = new Date().toISOString();

      const exists = localCollection.some(m => m.title.toLowerCase() === formatted.title.toLowerCase() && m.format === formatted.format);
      if (exists) return alert("Ce titre est déjà présent dans votre collection dans ce format.");

      await db.collection("movies").add(formatted);
      alert("Ajouté à la collection !");
    }

    // Affichage Collection
    function populateGenreDropdown() {
      const select = document.getElementById('filter-genre');
      const genres = new Set();
      localCollection.forEach(m => (m.genres || []).forEach(g => genres.add(g)));
      
      select.innerHTML = '<option value="">Tous les genres</option>';
      genres.forEach(g => {
        select.innerHTML += `<option value="${g}">${g}</option>`;
      });
    }

    function renderCollection() {
      const query = document.getElementById('search-collection').value.toLowerCase();
      const genre = document.getElementById('filter-genre').value;
      const order = document.getElementById('sort-order').value;

      let filtered = localCollection.filter(m => {
        const matchesQuery = m.title.toLowerCase().includes(query) ||
                             (m.cast && m.cast.some(a => a.toLowerCase().includes(query))) ||
                             (m.directors && m.directors.some(d => d.toLowerCase().includes(query)));
        const matchesGenre = genre === "" || (m.genres && m.genres.includes(genre));
        return matchesQuery && matchesGenre;
      });

      filtered.sort((a, b) => {
        return order === 'az' ? a.title.localeCompare(b.title) : b.title.localeCompare(a.title);
      });

      const grid = document.getElementById('collection-grid');
      grid.innerHTML = '';

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModalObject(m);
        card.innerHTML = `
          <span class="badge">${m.format || 'DVD'}</span>
          <img src="${m.poster || 'https://via.placeholder.com/150x225?text=No+Cover'}" alt="${m.title}">
          <div class="card-info">
            <div class="card-title">${m.title}</div>
            <div class="card-meta">${m.year || ''}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Modal
    function openModalObject(m) {
      const body = document.getElementById('modal-body');
      body.innerHTML = `
        <h2 style="margin-top:0;">${m.title} (${m.year})</h2>
        <p><strong>Format :</strong> ${m.format || 'DVD'}</p>
        <p><strong>Genres :</strong> ${(m.genres || []).join(', ')}</p>
        <p><strong>Réalisation :</strong> ${(m.directors || []).join(', ')}</p>
        <p><strong>Acteurs :</strong> ${(m.cast || []).join(', ')}</p>
        <p><strong>Disponible sur :</strong> ${(m.providers || []).join(', ') || 'Aucune plateforme'}</p>
        <p style="font-size:0.85rem; color:#ccc;">${m.overview}</p>
        <button class="action-btn" style="background:#c0392b;" onclick="deleteMovie('${m.docId}')">Supprimer de la collection</button>
      `;
      document.getElementById('detail-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }

    async function deleteMovie(docId) {
      if (confirm("Supprimer ce titre ?")) {
        await db.collection("movies").doc(docId).delete();
        closeModal();
      }
    }

    // Séries Diffusions & Envies
    async function loadAiringTodayTV() {
      if (!tmdbApiKey) return;
      const res = await fetch(`https://api.themoviedb.org/3/tv/airing_today?api_key=${tmdbApiKey}&language=fr-FR`);
      const data = await res.json();
      
      const grid = document.getElementById('airing-grid');
      grid.innerHTML = '';

      data.results.forEach(tv => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${tv.poster_path ? 'https://image.tmdb.org/t/p/w500' + tv.poster_path : 'https://via.placeholder.com/150x225'}" alt="${tv.name}">
          <div class="card-info">
            <div class="card-title">${tv.name}</div>
            <button class="action-btn" style="margin-top:5px; font-size:0.7rem;" onclick="toggleFavoriteTV(${tv.id})">
              ${localFavorites.includes(tv.id) ? '★ Favori' : '☆ Suivre'}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function toggleFavoriteTV(tvId) {
      const docRef = db.collection("favorites").doc(tvId.toString());
      if (localFavorites.includes(tvId)) {
        await docRef.delete();
      } else {
        await docRef.set({ id: tvId });
      }
      loadAiringTodayTV();
    }

    function renderWishlist() {
      const grid = document.getElementById('wishlist-grid');
      grid.innerHTML = '<p style="color:#aaa;">Vos favoris et titres à acquérir s\'affichent ici.</p>';
    }

    // EXPORTER LA COLLECTION (Sauvegarde JSON)
    function exportCollection() {
      if (localCollection.length === 0) {
        alert("Votre collection est vide.");
        return;
      }

      const cleanData = localCollection.map(({ docId, ...rest }) => rest);
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanData, null, 2));
      
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `sauvegarde_dvdtheque_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // IMPORTER UNE SAUVEGARDE (Import JSON vers Firestore)
    function importCollection(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const items = JSON.parse(e.target.result);
          if (!Array.isArray(items)) {
            alert("Format de fichier invalide.");
            return;
          }

          if (confirm(`Voulez-vous importer ${items.length} éléments dans votre base Cloud ?`)) {
            const batch = db.batch();
            let addedCount = 0;

            items.forEach((item) => {
              const exists = localCollection.some(m => m.title.toLowerCase() === item.title.toLowerCase() && m.format === item.format);
              if (!exists) {
                const newDocRef = db.collection("movies").doc();
                batch.set(newDocRef, item);
                addedCount++;
              }
            });

            await batch.commit();
            alert(`✅ Restauration terminée : ${addedCount} nouveaux titres ajoutés.`);
            event.target.value = '';
          }
        } catch (err) {
          alert("Erreur lors de la lecture du fichier JSON.");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
