<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma DVDthèque & Séries</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root { --bg-color: #121212; --card-bg: #1e1e1e; --accent: #e50914; --text: #ffffff; --text-dim: #aaaaaa; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding-bottom: 60px; }
    header { background-color: #000; padding: 15px; text-align: center; border-bottom: 2px solid var(--accent); }
    h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
    nav { display: flex; justify-content: space-around; background: #181818; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
    .nav-btn { background: none; border: none; color: var(--text-dim); padding: 12px 10px; font-size: 0.9rem; cursor: pointer; flex-grow: 1; }
    .nav-btn.active { color: var(--text); font-weight: bold; border-bottom: 3px solid var(--accent); }
    .container { padding: 15px; max-width: 1200px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    input, select, button { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 4px; font-size: 0.9rem; }
    input[type="text"] { flex-grow: 1; }
    button.action-btn { background: var(--accent); border: none; font-weight: bold; cursor: pointer; color: #fff; }
    .format-selector { display: flex; gap: 15px; align-items: center; margin: 10px 0; background: #222; padding: 10px; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
    .card { background: var(--card-bg); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; }
    .card img { width: 100%; height: 190px; object-fit: cover; }
    .card-info { padding: 8px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }
    .badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: bold; border: 1px solid var(--accent); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .modal-content { background: var(--card-bg); padding: 20px; border-radius: 8px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; color: #fff; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>Ma DVDthèque & Séries</h1>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('collection', event)">Ma Collection</button>
    <button class="nav-btn" onclick="switchTab('search', event)">Ajouter (TMDB)</button>
    <button class="nav-btn" onclick="switchTab('airing', event)">Séries du Jour</button>
    <button class="nav-btn" onclick="switchTab('config', event)">Config</button>
  </nav>

  <div class="container">
    <section id="tab-collection" class="tab-content active">
      <div class="controls">
        <input type="text" id="search-collection" placeholder="Chercher titre, acteur, réalisateur..." oninput="renderCollection()">
        <select id="filter-genre" onchange="renderCollection()"><option value="">Tous les genres</option></select>
        <select id="sort-order" onchange="renderCollection()"><option value="az">A - Z</option><option value="za">Z - A</option></select>
      </div>
      <div id="collection-grid" class="grid"></div>
    </section>

    <section id="tab-search" class="tab-content">
      <div class="format-selector">
        <span>Format d'ajout :</span>
        <label><input type="radio" name="format-choice" value="DVD" checked> DVD</label>
        <label><input type="radio" name="format-choice" value="Blu-ray"> Blu-ray</label>
        <label><input type="radio" name="format-choice" value="4K UHD"> 4K UHD</label>
      </div>
      <div class="controls">
        <select id="tmdb-type"><option value="movie">Film</option><option value="tv">Série</option></select>
        <input type="text" id="tmdb-query" placeholder="Titre à rechercher...">
        <button class="action-btn" onclick="searchMovie()">Rechercher</button>
      </div>
      <div id="search-grid" class="grid"></div>
    </section>

    <section id="tab-airing" class="tab-content">
      <p style="font-size:0.85rem; color:#aaa;">Séries diffusées aujourd'hui.</p>
      <div id="airing-grid" class="grid"></div>
    </section>

    <section id="tab-config" class="tab-content">
      <h3>Configuration Clé TMDB</h3>
      <div class="controls">
        <input type="text" id="api-key-input" placeholder="Insérer la clé API TMDB">
        <button class="action-btn" onclick="saveApiKey()">Enregistrer</button>
      </div>
      <hr style="border-color:#333; margin:20px 0;">
      <h3>Sauvegarde & Restauration</h3>
      <div class="controls">
        <button onclick="exportCollection()">Exporter la collection (JSON)</button>
        <input type="file" id="import-file" accept=".json" onchange="importCollection(event)" style="display:none;">
        <button onclick="document.getElementById('import-file').click()">Importer un fichier (JSON)</button>
      </div>
    </section>
  </div>

  <div id="detail-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABV3JlLUv2gBksRgwSdOBo9MKWPE1s2ZU",
      authDomain: "dvdtheque-6a431.firebaseapp.com",
      projectId: "dvdtheque-6a431",
      storageBucket: "dvdtheque-6a431.firebasestorage.app",
      messagingSenderId: "1024820482868",
      appId: "1:1024820482868:web:8be06d09827f7a5bfecb61",
      measurementId: "G-C75SM4T13P"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let localCollection = [];
    let tmdbApiKey = "";

    // Lecture robuste de la collection
    db.collection("movies").onSnapshot(snapshot => {
      localCollection = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        localCollection.push({
          docId: doc.id,
          title: data.title || data.nom || "Titre inconnu",
          year: data.year || data.annee || "",
          poster: data.poster || data.image || data.poster_path || "",
          format: data.format || "DVD",
          genres: data.genres || [],
          directors: data.directors || data.realisateur || [],
          cast: data.cast || data.acteurs || [],
          overview: data.overview || data.synopsis || "Aucun synopsis.",
          providers: data.providers || []
        });
      });
      populateGenreDropdown();
      renderCollection();
    }, err => {
      console.error("Erreur de chargement Firestore :", err);
    });

    // Chargement de la clé TMDB
    db.collection("config").doc("tmdb").onSnapshot(doc => {
      if (doc.exists && doc.data().key) {
        tmdbApiKey = doc.data().key;
        const input = document.getElementById('api-key-input');
        if (input) input.value = tmdbApiKey;
      }
    });

    function switchTab(tabName, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      if (evt && evt.target) evt.target.classList.add('active');

      if (tabName === 'airing') loadAiringTodayTV();
      if (tabName === 'config') {
        const input = document.getElementById('api-key-input');
        if (input) input.value = tmdbApiKey;
      }
    }

    function getSelectedFormat() {
      const radios = document.getElementsByName('format-choice');
      for (let r of radios) { if (r.checked) return r.value; }
      return 'DVD';
    }

    async function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (!key) return alert("Veuillez saisir une clé.");
      tmdbApiKey = key;
      await db.collection("config").doc("tmdb").set({ key: key }, { merge: true });
      alert("Clé API enregistrée !");
    }

    async function fetchMovieDetails(id, type = 'movie') {
      if (!tmdbApiKey) return {};
      try {
        const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${tmdbApiKey}&append_to_response=credits,watch/providers&language=fr-FR`);
        return await res.json();
      } catch (e) { return {}; }
    }

    function formatTmdbItem(m, searchType) {
      const directors = m.credits?.crew ? m.credits.crew.filter(c => c.job === 'Director').map(c => c.name) : [];
      const cast = m.credits?.cast ? m.credits.cast.slice(0, 5).map(c => c.name) : [];
      const providers = m['watch/providers']?.results?.FR?.flatrate ? m['watch/providers'].results.FR.flatrate.map(p => p.provider_name) : [];

      return {
        id: m.id,
        title: m.title || m.name,
        type: searchType,
        year: (m.release_date || m.first_air_date || '').slice(0, 4),
        poster: m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : '',
        overview: m.overview || 'Aucun synopsis disponible.',
        genres: m.genres ? m.genres.map(g => g.name) : [],
        directors: directors,
        cast: cast,
        providers: providers
      };
    }

    async function searchMovie() {
      const query = document.getElementById('tmdb-query').value.trim();
      const type = document.getElementById('tmdb-type').value;
      if (!query || !tmdbApiKey) return alert("Vérifiez votre recherche et la clé API dans Config.");

      const res = await fetch(`https://api.themoviedb.org/3/search/${type}?api_key=${tmdbApiKey}&query=${encodeURIComponent(query)}&language=fr-FR`);
      const data = await res.json();
      
      const grid = document.getElementById('search-grid');
      grid.innerHTML = '';

      for (let item of data.results) {
        const card = document.createElement('div');
        card.className = 'card';
        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/150x225?text=No+Cover';
        const title = item.title || item.name;
        const year = (item.release_date || item.first_air_date || '').slice(0, 4);

        card.innerHTML = `
          <img src="${poster}" alt="${title}">
          <div class="card-info">
            <div class="card-title">${title}</div>
            <div class="card-meta">${year}</div>
            <button class="action-btn" style="margin-top:5px; font-size:0.7rem;" onclick="triggerAddMovie('${item.id}', '${type}')">+ Ajouter</button>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    async function triggerAddMovie(id, type) {
      const full = await fetchMovieDetails(id, type);
      const formatted = formatTmdbItem(full, type);
      formatted.format = getSelectedFormat();
      formatted.addedAt = new Date().toISOString();

      await db.collection("movies").add(formatted);
      alert("Ajouté à la collection !");
    }

    function populateGenreDropdown() {
      const select = document.getElementById('filter-genre');
      const genres = new Set();
      localCollection.forEach(m => (m.genres || []).forEach(g => genres.add(g)));
      
      select.innerHTML = '<option value="">Tous les genres</option>';
      genres.forEach(g => select.innerHTML += `<option value="${g}">${g}</option>`);
    }

    function renderCollection() {
      const query = document.getElementById('search-collection').value.toLowerCase();
      const genre = document.getElementById('filter-genre').value;
      const order = document.getElementById('sort-order').value;

      let filtered = localCollection.filter(m => {
        const matchesQuery = m.title.toLowerCase().includes(query) ||
                             (Array.isArray(m.cast) && m.cast.some(a => String(a).toLowerCase().includes(query))) ||
                             (Array.isArray(m.directors) && m.directors.some(d => String(d).toLowerCase().includes(query)));
        const matchesGenre = genre === "" || (Array.isArray(m.genres) && m.genres.includes(genre));
        return matchesQuery && matchesGenre;
      });

      filtered.sort((a, b) => order === 'az' ? a.title.localeCompare(b.title) : b.title.localeCompare(a.title));

      const grid = document.getElementById('collection-grid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">Aucun film trouvé.</p>';
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModalObject(m);
        card.innerHTML = `
          <span class="badge">${m.format}</span>
          <img src="${m.poster || 'https://via.placeholder.com/150x225?text=No+Cover'}" alt="${m.title}">
          <div class="card-info">
            <div class="card-title">${m.title}</div>
            <div class="card-meta">${m.year}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModalObject(m) {
      const body = document.getElementById('modal-body');
      body.innerHTML = `
        <h2 style="margin-top:0;">${m.title} (${m.year})</h2>
        <p><strong>Format :</strong> ${m.format}</p>
        <p><strong>Genres :</strong> ${(m.genres || []).join(', ')}</p>
        <p><strong>Réalisation :</strong> ${(m.directors || []).join(', ')}</p>
        <p><strong>Acteurs :</strong> ${(m.cast || []).join(', ')}</p>
        <p><strong>Disponible sur :</strong> ${(m.providers || []).join(', ') || 'Aucune plateforme'}</p>
        <p style="font-size:0.85rem; color:#ccc;">${m.overview}</p>
        <button class="action-btn" style="background:#c0392b;" onclick="deleteMovie('${m.docId}')">Supprimer</button>
      `;
      document.getElementById('detail-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }

    async function deleteMovie(docId) {
      if (confirm("Supprimer ce titre ?")) {
        await db.collection("movies").doc(docId).delete();
        closeModal();
      }
    }

    async function loadAiringTodayTV() {
      if (!tmdbApiKey) return;
      const res = await fetch(`https://api.themoviedb.org/3/tv/airing_today?api_key=${tmdbApiKey}&language=fr-FR`);
      const data = await res.json();
      
      const grid = document.getElementById('airing-grid');
      grid.innerHTML = '';

      (data.results || []).forEach(tv => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${tv.poster_path ? 'https://image.tmdb.org/t/p/w500' + tv.poster_path : 'https://via.placeholder.com/150x225'}" alt="${tv.name}">
          <div class="card-info">
            <div class="card-title">${tv.name}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function exportCollection() {
      if (localCollection.length === 0) return alert("Votre collection est vide.");
      const cleanData = localCollection.map(({ docId, ...rest }) => rest);
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `sauvegarde_dvdtheque_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importCollection(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const items = JSON.parse(e.target.result);
          if (!Array.isArray(items)) return alert("Format invalide.");

          if (confirm(`Importer ${items.length} éléments ?`)) {
            const batch = db.batch();
            let addedCount = 0;
            items.forEach((item) => {
              const newDocRef = db.collection("movies").doc();
              batch.set(newDocRef, item);
              addedCount++;
            });
            await batch.commit();
            alert(`✅ ${addedCount} éléments ajoutés.`);
            event.target.value = '';
          }
        } catch (err) { alert("Erreur de lecture."); }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
